<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="earth-ocean" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="52%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
    <clipPath id="earth-clip">
      <circle cx="100" cy="100" r="84"/>
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="84" fill="url(#earth-ocean)"/>

  <g clip-path="url(#earth-clip)">
    <!-- continents -->
    <g fill="#34D399">
      <path d="M42 58c10-14 26-18 38-12s12 22 2 30-24 8-34 0-14-10-6-18Z"/>
      <path d="M96 46c14-6 28 0 32 10s-6 18-18 16-22-8-22-16 2-8 8-10Z"/>
      <path d="M120 108c12-2 22 6 22 16s-10 20-22 18-18-10-16-20 8-13 16-14Z"/>
    </g>
    <g fill="#10B981">
      <path d="M70 118c10-4 20 2 20 12s-10 16-20 14-14-12-10-20 6-5 10-6Z"/>
      <path d="M62 86c8-2 14 4 13 12s-8 14-15 12-10-10-7-17 5-6 9-7Z"/>
    </g>

    <!-- polar caps -->
    <ellipse cx="100" cy="16" rx="60" ry="16" fill="#FFFFFF" opacity="0.75"/>
    <ellipse cx="100" cy="188" rx="52" ry="14" fill="#FFFFFF" opacity="0.7"/>

    <!-- cloud swirls -->
    <g fill="#FFFFFF" opacity="0.55">
      <ellipse cx="70" cy="64" rx="26" ry="9"/>
      <ellipse cx="132" cy="88" rx="30" ry="10"/>
      <ellipse cx="96" cy="140" rx="22" ry="8"/>
      <ellipse cx="148" cy="52" rx="18" ry="7"/>
    </g>

    <!-- terminator shading -->
    <ellipse cx="160" cy="150" rx="80" ry="80" fill="#0C1B3A" opacity="0.32"/>
    <ellipse cx="56" cy="58" rx="52" ry="52" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- atmosphere -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#93C5FD" stroke-width="5" opacity="0.45"/>
</svg>
