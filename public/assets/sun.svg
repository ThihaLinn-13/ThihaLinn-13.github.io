<svg width="260" height="260" viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="38%" stop-color="#FDE68A" stop-opacity="0.5"/>
      <stop offset="68%" stop-color="#FCD34D" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sun-core" cx="36%" cy="32%" r="74%">
      <stop offset="0%" stop-color="#FFFDF5"/>
      <stop offset="42%" stop-color="#FEF3C7"/>
      <stop offset="78%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F7B733"/>
    </radialGradient>
    <filter id="soft-rays" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- soft atmospheric glow -->
  <circle cx="130" cy="130" r="128" fill="url(#sun-glow)"/>

  <!-- blurred rays -->
  <g stroke="#FCD34D" stroke-width="8" stroke-linecap="round" opacity="0.7" filter="url(#soft-rays)">
    <path d="M130 34v26"/>
    <path d="M130 200v26"/>
    <path d="M34 130h26"/>
    <path d="M200 130h26"/>
    <path d="M61 61l18 18"/>
    <path d="M181 181l18 18"/>
    <path d="M199 61l-18 18"/>
    <path d="M79 181l-18 18"/>
  </g>

  <!-- core -->
  <circle cx="130" cy="130" r="56" fill="url(#sun-core)"/>
</svg>
